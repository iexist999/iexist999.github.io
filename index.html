<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pocketSandBlocks</title>
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <img class="game-icon" src="images/icon.png" alt="pocketSandBlocks icon">
    <h1 class="game-title"><span class="w-pocket">pocket</span><span class="w-sand">Sand</span><span class="w-blocks">Blocks</span></h1>

    <nav class="tabs" role="tablist" aria-label="Site sections">
      <button class="tab active" role="tab" data-tab="home"   aria-selected="true">home</button>
      <button class="tab"        role="tab" data-tab="devlog" aria-selected="false">devlog</button>
      <button class="tab"        role="tab" data-tab="about"  aria-selected="false">about</button>
    </nav>

    <div class="scribble" aria-hidden="true">
      <img src="images/scribble.png" alt="">
      <img src="images/scribble.png" alt="">
    </div>
  </header>

  <main class="pages">
    <section id="home" class="panel visible" role="tabpanel">
      <h2>Welcome to pocketSandBlocks</h2>
      <p>this website is under construction.</p>
    </section>

    <section id="devlog" class="panel" role="tabpanel" hidden>
      <article class="entry">
        <p>this website is under construction.</p>
      </article>
    </section>

    <section id="about" class="panel" role="tabpanel" hidden>
      <p>this website is under construction.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
